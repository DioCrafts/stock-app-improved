[project]
name = "equity-research-backend"
version = "0.1.0"
description = "API FastAPI que sirve el contrato de datos del Equity Research Terminal (ingesta vía yfinance; mercados US/CA/UK)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "yfinance>=0.2.50",
    "financedatabase>=2.4.0",
    "diskcache>=5.6",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
