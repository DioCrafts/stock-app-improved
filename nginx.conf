# Rate limit por IP para la API (M2): 10 req/s con ráfaga de 20.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;                       # límite de tamaño de petición (M4)

    # Cabeceras de seguridad (clickjacking, MIME-sniffing, referrer) — M4
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    gzip on;                                        # compresión (M4)
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # SPA: cualquier ruta desconocida → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend (la barra final en proxy_pass quita el prefijo /api/)
    #   /api/companies  →  http://backend:8000/companies
    location /api/ {
        limit_req zone=api burst=20 nodelay;        # rate limit (M2)
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /financials hace 3 llamadas a yfinance con reintentos → margen amplio (M9)
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
